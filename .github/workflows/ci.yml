name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit-tests:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.302'

      - name: Show .NET SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore PayFlow.slnx

      - name: Build
        run: dotnet build PayFlow.slnx --configuration Release --no-restore

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          projects=(tests/Unit/*/*.csproj)

          if [ ${#projects[@]} -eq 0 ]; then
            echo "No unit test projects found."
            exit 1
          fi

          for project in "${projects[@]}"; do
            echo "Running $project"
            dotnet test "$project" --configuration Release --no-build
          done

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.302'

      - name: Verify Docker
        run: docker info

      - name: Restore
        run: dotnet restore PayFlow.slnx

      - name: Build
        run: dotnet build PayFlow.slnx --configuration Release --no-restore

      - name: Run integration tests
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          projects=(tests/Integration/*/*.csproj)

          if [ ${#projects[@]} -eq 0 ]; then
            echo "No integration test projects found."
            exit 1
          fi

          for project in "${projects[@]}"; do
            echo "Running $project"
            dotnet test "$project" --configuration Release --no-build
          done
