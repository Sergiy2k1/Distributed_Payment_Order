name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit-tests:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.302'

      - name: Show .NET SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore PayFlow.slnx

      - name: Build
        run: dotnet build PayFlow.slnx --configuration Release --no-restore

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          projects=(tests/Unit/*/*.csproj)

          if [ ${#projects[@]} -eq 0 ]; then
            echo "No unit test projects found."
            exit 1
          fi

          for project in "${projects[@]}"; do
            echo "Running $project"
            dotnet test "$project" --configuration Release --no-build
          done

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.302'

      - name: Verify Docker
        run: docker info

      - name: Restore
        run: dotnet restore PayFlow.slnx

      - name: Build
        run: dotnet build PayFlow.slnx --configuration Release --no-restore

      - name: Run integration tests
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          projects=(tests/Integration/*/*.csproj)

          if [ ${#projects[@]} -eq 0 ]; then
            echo "No integration test projects found."
            exit 1
          fi

          for project in "${projects[@]}"; do
            echo "Running $project"
            dotnet test "$project" --configuration Release --no-build
          done

  container-images:
    name: Container / ${{ matrix.image }}
    needs:
      - build-and-unit-tests
      - integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: payflow-order-api
            dockerfile: src/Services/Order/PayFlow.Order.Api/Dockerfile
          - image: payflow-inventory-worker
            dockerfile: src/Services/Inventory/PayFlow.Inventory.Worker/Dockerfile
          - image: payflow-payment-api
            dockerfile: src/Services/Payment/PayFlow.Payment.Api/Dockerfile
          - image: payflow-payment-worker
            dockerfile: src/Services/Payment/PayFlow.Payment.Worker/Dockerfile
          - image: payflow-saga-worker
            dockerfile: src/Services/Saga/PayFlow.Saga.Worker/Dockerfile
          - image: payflow-mock-payment-provider
            dockerfile: src/Services/MockPaymentProvider/PayFlow.MockPaymentProvider/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/sergiy2k1/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and optionally publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
