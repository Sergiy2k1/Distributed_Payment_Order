services:
  order-db:
    image: postgres:17-alpine
    container_name: payflow-order-db
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: payflow_order
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:?ORDER_DB_PASSWORD is required}
    ports:
      - "${ORDER_DB_PORT:-5432}:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow_order -d orders_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  order-db-data:
